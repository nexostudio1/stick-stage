[project]
name = "stickstage-shorts"
version = "0.1.0"
description = "Long video -> shorts: analyse, select, frame. Feeds the ShortFromFootage composition."
requires-python = ">=3.11,<3.13"
dependencies = [
  "faster-whisper>=1.1",
  "mlx-whisper>=0.4",
  "mediapipe>=0.10.14",
  "opencv-python-headless>=4.10",
  "numpy>=1.26",
  "jsonschema>=4.23",
]

[project.scripts]
shorts = "shorts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shorts"]
